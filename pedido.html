<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e78"><title>Haz tu pedido</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ac:#1f4e78;--acx:#fff;--bd:#d9dee4;--bad:#c0392b;--bf:none;--ff:Arial,Helvetica,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#6fa8dc;--acx:#10161c;--bd:#33404d;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#6fa8dc;--acx:#10161c;--bd:#33404d;--bad:#ff7b6b}
:root[data-theme="rosa"]{--bg:#fff5f8;--bgi:linear-gradient(180deg,#fffafc,#ffeaf1);--card:#fff;--tx:#4a2733;--mu:#9a6b7b;--ac:#d6457a;--acx:#fff;--bd:#f3cddb;--bad:#c0392b}
:root[data-theme="azul"]{--bg:#e6eff9;--bgi:linear-gradient(160deg,#f6faff 0%,#dbe9f8 55%,#eef5fc 100%);--card:rgba(255,255,255,.62);--tx:#23405e;--mu:#5a7694;--ac:#3d79b0;--acx:#fff;--bd:rgba(110,155,205,.35);--bad:#c0392b;--bf:blur(10px) saturate(1.3)}
:root[data-theme="eco"]{--bg:#eef5ef;--bgi:linear-gradient(180deg,#f6fbf6,#e3efe5);--card:#fbfdfb;--tx:#1f3a2a;--mu:#5a7a64;--ac:#2f7d4f;--acx:#fff;--bd:#cfe0d3;--bad:#b3402e}
:root[data-font="mod"]{--ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
:root[data-font="red"]{--ff:ui-rounded,"SF Pro Rounded",Nunito,"Varela Round","Trebuchet MS",Verdana,sans-serif}
:root[data-font="ele"]{--ff:Georgia,"Times New Roman",Times,serif}
:root[data-font="tec"]{--ff:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);background-image:var(--bgi,none);background-attachment:fixed;color:var(--tx);font:15px/1.4 var(--ff)}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}h1{font-size:19px;margin:0}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px;display:grid;gap:12px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
button{cursor:pointer;width:auto;touch-action:manipulation}button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:bold}button:disabled{opacity:.5}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:grid;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.tile{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}.tile small{color:var(--mu)}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.ln button{padding:4px 12px;min-height:38px}.tt{display:flex;justify-content:space-between}.big{font-size:18px;font-weight:bold}
.mu{color:var(--mu);font-size:13px}.tile img{width:100%;height:84px;object-fit:cover;border-radius:6px;margin-bottom:4px}
@media(min-width:900px){main{max-width:1020px;grid-template-columns:1fr 340px;align-items:start}.col2{grid-column:2;grid-row:1/span 4;position:sticky;top:12px}}.msg{color:var(--bad)}.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
header,.box{-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none)}
:root[data-theme="azul"] .box{border-radius:14px;box-shadow:0 4px 18px rgba(80,130,190,.12)}
:root[data-theme="azul"] button:not(.pri),:root[data-theme="azul"] select,:root[data-theme="azul"] input,:root[data-theme="azul"] textarea{background:rgba(255,255,255,.55)}
:root[data-theme="rosa"] .box{border-radius:14px}:root[data-theme="eco"] .box{border-radius:12px;box-shadow:0 2px 10px rgba(47,125,79,.08)}
header{display:flex;gap:10px;align-items:center}
.stp{display:flex;gap:6px}.stp span{flex:1;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--bd);font-size:13px;color:var(--mu)}.stp .on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:bold}.stp .dn{border-color:var(--ac);color:var(--tx)}
</style><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="description" content="Haz tu pedido en línea"></head><body>
<header><span id="lgo"></span><h1 id="bz">Haz tu pedido</h1></header><main id="m"><p>Cargando…</p></main>
<script>
// ▼ Pega aquí la URL de tu Apps Script (la misma de la app, termina en /exec). No es secreta.
const API='https://script.google.com/macros/s/AKfycbwH6odWAL6eCLvVIFHwM6kYPSm0RLZQm12SyHVTsO6E4mYTxczlBpkjuzTl_tq8xww4VQ/exec';
const jf=(u,o,ms)=>{const ac=typeof AbortController!=='undefined'?new AbortController():null,t=ac?setTimeout(()=>ac.abort(),ms||25000):0;return fetch(u,{...(o||{}),signal:ac?ac.signal:undefined}).finally(()=>clearTimeout(t))};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'RD$ '+(+n||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=(new URLSearchParams(location.search).get('t')||'principal').toLowerCase(),SQ=new URLSearchParams(location.search).get('s')||'';let TR=null;
let mi=0,C=null,cart=ld('pd_cart',{}),form=ld('pd_form',{}),q='',oid=null,done=null,busy=false,msg='';
const ERR={off:'Los pedidos por internet no están disponibles en este momento.',busy:'Hay muchos pedidos ahora mismo. Intenta de nuevo en unos minutos.',fecha:'Elige una fecha de entrega desde hoy hasta dentro de 60 días.',bad:'Revisa tus datos: nombre, teléfono y al menos un producto.',cierre:'Ya no recibimos pedidos para hoy (se aceptan hasta 20 minutos antes del cierre). Elige otro día.',cerrado:'Ese día la tienda no abre. Elige otra fecha.',trk:'No encontramos ese pedido. Revisa que el enlace esté completo.',nowa:'Esta tienda aún no tiene WhatsApp configurado. Quita los productos "a convenir" o contáctala directamente.',tienda:'Esta tienda no está disponible en este momento. Revisa que el enlace sea el correcto.',net:'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo (no se duplicará el pedido).'};
const TH_OK=['orig','dark','rosa','azul','eco'],FT_OK=['std','mod','red','ele','tec'],TH_C={orig:'#1f4e78',dark:'#1d242c',rosa:'#d6457a',azul:'#3d79b0',eco:'#2f7d4f'};
function applyLook(l){l=l||{};const r=document.documentElement;if(TH_OK.includes(l.t)&&l.t!=='orig')r.dataset.theme=l.t;else delete r.dataset.theme;if(FT_OK.includes(l.f)&&l.f!=='std')r.dataset.font=l.f;else delete r.dataset.font;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=TH_C[l.t]||TH_C.orig}
function applyIco(){const k=(C&&/^data:image\/(png|jpeg|webp);base64,/.test(C.ico||''))?C.ico:'',e=$('#lgo');if(e)e.innerHTML=k?`<img src="${esc(k)}" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover;display:block">`:'';const l=document.querySelector('link[rel=icon]');if(l)l.href=k||'icon.svg'}
const P=c=>C.products.find(p=>p.code===c);
const lines=()=>Object.keys(cart).filter(c=>cart[c]>0&&P(c)).map(c=>({p:P(c),q:cart[c]}));
const tot=()=>{const s=lines().reduce((t,l)=>t+(l.p.var?0:l.p.price*l.q),0),i=s*C.rate/100;return{s,i,t:s+i}};
function orderText(no,trk){const T=tot();return (trk?'Seguimiento: '+trkUrl(trk)+'\n':'')+'Hola, hice el pedido '+(no||'')+' en '+C.biz+':\n'+lines().map(l=>l.q+' x '+l.p.name).join('\n')+'\nTotal: '+money(T.t)+'\nEntrega: '+(form.fecha||'')+'\nNombre: '+(form.cliente||'')}
const trkUrl=k=>location.origin+location.pathname+'?t='+encodeURIComponent(T)+'&s='+k,STL=['Recibido','Preparando','Listo','Entregado'];
function trackRender(){const m=$('#m');if(TR===null){m.innerHTML='<div class="box">Cargando tu pedido…</div>';return}
if(TR===false){m.innerHTML=`<div class="box">${ERR.net}<button class="pri" data-a="trk">Reintentar</button></div>`;return}
if(!TR.ok){m.innerHTML=`<div class="box">${ERR.trk}</div>`;return}
$('#bz').textContent=TR.biz||'Tu pedido';C={ico:TR.ico,look:TR.look,biz:TR.biz,on:true};applyLook(TR.look);applyIco();
const bad=TR.estado==='cancelado'||TR.estado==='perdido',idx=TR.estado==='completado'?3:(TR.prog==='listo'?2:TR.prog==='preparando'?1:0);
m.innerHTML=`<div class="box"><h2 style="margin:0">Pedido ${esc(TR.no)}</h2>${bad?`<p class="msg"><b>Este pedido fue cancelado.</b>${TR.why?' '+esc(TR.why):''}</p>`:`<div class="stp">${STL.map((x,i)=>`<span class="${i===idx?'on':(i<idx?'dn':'')}">${i<idx?'✔ ':''}${x}</span>`).join('')}</div><p>${['Recibimos tu pedido. Pronto empezamos a prepararlo.','Estamos preparando tu pedido.','¡Tu pedido está listo!','Pedido entregado. ¡Gracias!'][idx]}</p>`}<p class="mu">Entrega: ${esc(String(TR.fecha||'').split('-').reverse().join('/'))}</p></div>
<div class="box"><b>Tu pedido</b>${TR.items.map(i=>`<div class="tt"><span>${i.qty}× ${esc(i.name)}</span></div>`).join('')}<div class="tt big"><span>Total</span><span>${money(TR.total)}</span></div>${TR.abonado>0?`<div class="tt"><span>Abonado</span><span>${money(TR.abonado)}</span></div><div class="tt"><b>Saldo pendiente</b><b>${money(TR.saldo)}</b></div>`:''}</div>${TR.wa?`<a href="https://wa.me/${esc(TR.wa)}?text=${encodeURIComponent('Hola, consulto por mi pedido '+TR.no)}" target="_blank" rel="noopener"><button class="pri" style="width:100%">💬 Escribir por WhatsApp</button></a>`:''}<p class="mu">Esta página se actualiza sola cada 30 segundos.</p>`}
async function loadTrack(){try{TR=await (await jf(API+(API.includes('?')?'&':'?')+'action=track&t='+encodeURIComponent(T)+'&s='+encodeURIComponent(SQ))).json()}catch(e){if(TR===null)TR=false}render()}
function render(){const m=$('#m');if(SQ&&API){trackRender();return}
if(!API){m.innerHTML='<div class="box">Esta página aún no está configurada.</div>';return}
if(C===null){m.innerHTML='<div class="box">No pudimos cargar el menú. Revisa tu conexión.<button class="pri" data-a="retry">Reintentar</button></div>';return}
applyLook(C.look);applyIco();
if(!C.on){m.innerHTML='<div class="box">'+(C.why==='tienda'?ERR.tienda:ERR.off)+'</div>';return}
$('#bz').textContent=C.biz||'Haz tu pedido';
if(done){m.innerHTML=`<div class="box"><h2 style="margin:0">✔ ¡Pedido recibido!</h2>${done.no?`<p>Tu número de pedido es <b>${esc(done.no)}</b>.</p>`:''}<p>Total: <b>${money(done.total)}</b></p>${done.trk?`<p><a href="${esc(trkUrl(done.trk))}"><button class="pri" style="width:100%">🔗 Seguir mi pedido</button></a></p><p class="mu">Guarda este enlace: ahí verás cuándo está listo.</p>`:''}<p class="mu">Nos comunicaremos contigo al teléfono que dejaste.</p>${C.wa?`<a href="https://wa.me/${esc(C.wa)}?text=${encodeURIComponent(done.text)}" target="_blank" rel="noopener"><button class="pri" style="width:100%">Avisar por WhatsApp</button></a>`:''}<button data-a="again">Hacer otro pedido</button></div>`;return}
const L=lines(),T=L.length?tot():{s:0,i:0,t:0},hoy=minDate(),hv=L.some(l=>l.p.var),nowa=hv&&!C.wa;if(!form.fecha||form.fecha<hoy)form.fecha=hoy;
m.innerHTML=`${mediaHtml()}<div class="box"><input data-f="q" placeholder="Buscar producto…" value="${esc(q)}"><div class="tiles" id="tl">${tiles()}</div></div>
<div class="box"><b>Tu pedido</b>${L.map(l=>`<div class="ln"><span>${esc(l.p.name)}<br><span class="mu">${l.p.var?'Precio a convenir':money(l.p.price)}</span></span><span><button data-a="dec" data-c="${esc(l.p.code)}">−</button> <b>${l.q}</b> <button data-a="inc" data-c="${esc(l.p.code)}">+</button></span><b>${l.p.var?'A convenir':money(l.p.price*l.q)}</b></div>`).join('')||'<span class="mu">Toca un producto para agregarlo.</span>'}
<div class="tt"><span>Subtotal${hv?' (sin lo a convenir)':''}</span><span>${money(T.s)}</span></div><div class="tt"><span>ITBIS (${C.rate}%)</span><span>${money(T.i)}</span></div><div class="tt big"><span>Total</span><span>${money(T.t)}</span></div></div>
<div class="box"><b>Tus datos</b><input data-f="cliente" placeholder="Nombre" autocomplete="name" value="${esc(form.cliente||'')}"><input data-f="tel" type="tel" placeholder="Teléfono (WhatsApp)" autocomplete="tel" value="${esc(form.tel||'')}">${horNote()}<label class="mu">Fecha de entrega<input data-f="fecha" type="date" min="${hoy}" value="${esc(form.fecha)}"></label>
<select data-f="pago">${['Efectivo','Tarjeta','Transferencia'].map(x=>`<option${(form.pago||'Efectivo')===x?' selected':''}>${x}</option>`).join('')}</select><textarea data-f="nota" rows="2" placeholder="Dirección o indicaciones (opcional)">${esc(form.nota||'')}</textarea>
<input class="hp" data-f="hp" tabindex="-1" autocomplete="off" aria-hidden="true" value="${esc(form.hp||'')}"><span class="mu">El pago se hace al recibir o según acordemos contigo.</span><p class="msg" id="er">${esc(nowa?ERR.nowa:msg)}</p>${hv?'<div class="mu"><b>Tu pedido incluye productos con precio a convenir.</b> Lo coordinamos contigo por WhatsApp para confirmar el precio.</div>':''}
<button class="pri" data-a="send"${L.length&&!busy&&!nowa?'':' disabled'}>${busy?'Enviando…':(hv?'💬 Continuar por WhatsApp':'Enviar pedido')}</button></div>`}
const OKE=['https://www.youtube.com/embed/','https://player.vimeo.com/video/','https://drive.google.com/file/d/'];
function mediaHtml(){const M=(C&&C.media)||[];if(!M.length)return '';const m=M[mi%M.length];let body;
if(m.type==='video')body=`<video src="${esc(m.url)}" controls muted playsinline loop autoplay style="width:100%;border-radius:10px"></video>`;
else if(m.type==='embed'&&OKE.some(x=>String(m.url).startsWith(x)))body=`<iframe src="${esc(m.url)}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
else body=`<img src="${esc(m.url)}" alt="${esc(m.title||'')}" referrerpolicy="no-referrer" style="width:100%;border-radius:10px">`;
return `<div class="box col2" id="mk"><b>Promociones</b>${body}${m.title?`<div class="mu">${esc(m.title)}</div>`:''}${M.length>1?`<div class="tt"><button data-a="mp">‹</button><span class="mu">${(mi%M.length)+1} / ${M.length}</span><button data-a="mn">›</button></div>`:''}</div>`}
const minDate=()=>{const h=C.hoy||ymd(new Date());if(C.sameDay===false){const d=new Date(h+'T12:00:00');d.setDate(d.getDate()+1);return ymd(d)}return h};
const DNs=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const horNote=()=>{if(!(C.hor&&C.hor.length))return '';const ab=[1,2,3,4,5,6,0].map(d=>C.hor.find(x=>x.d===d)).filter(x=>x&&x.on),ce=(C.closed||[]).map(d=>DNs[d]);
return `<div class="mu">🕘 Horario: ${ab.map(x=>DNs[x.d]+' '+esc(x.a)+'–'+esc(x.c)).join(' · ')||'—'}${ce.length?' · Cerrado: '+ce.join(', '):''}</div><div class="${C.sameDay===false?'msg':'mu'}">${C.sameDay===false?'Ya no recibimos pedidos para hoy: elige otro día.':(C.cutoff?'Pedidos para hoy: hasta las '+esc(C.cutoff)+'.':'')}</div><div class="msg" style="font-size:14px;font-weight:bold">Pedidos hechos fuera de hora están sujetos a confirmación.</div>`};
const tiles=()=>C.products.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="tile" data-a="add" data-c="${esc(p.code)}">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<b>${esc(p.name)}</b><small>${p.var?'Precio a convenir':money(p.price)}</small></button>`).join('')||'<span class="mu">Sin resultados</span>';
function waGo(){const L=lines(),f=form,T=tot();if(!C.wa){msg=ERR.nowa;render();return}msg='';
const txt='Hola, quiero hacer un pedido en '+C.biz+':\n'+L.map(l=>l.q+' x '+l.p.name+(l.p.var?' (precio a convenir)':'')).join('\n')+(L.some(l=>!l.p.var)?'\nTotal de lo que tiene precio fijo (con ITBIS): '+money(T.t):'')+'\nEntrega: '+(f.fecha||'')+'\nNombre: '+(f.cliente||'')+'\nTeléfono: '+(f.tel||'')+(f.nota?'\nNota: '+f.nota:'');
window.open('https://wa.me/'+C.wa+'?text='+encodeURIComponent(txt),'_blank','noopener');render()}
async function send(){const L=lines();if(!L.length)return;const f=form;
if(!(f.cliente||'').trim()||(f.tel||'').replace(/\D/g,'').length<7){msg='Escribe tu nombre y un teléfono válido.';render();return}
if(L.some(l=>l.p.var)){waGo();return}
if((C.closed||[]).includes(new Date(f.fecha+'T12:00:00').getDay())){msg=ERR.cerrado;render();return}
msg='';busy=true;render();if(!oid)oid='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
let j;try{const r=await jf(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'webOrder',t:T,order:{id:oid,cliente:f.cliente,tel:f.tel,fecha:f.fecha,nota:f.nota||'',pago:f.pago||'Efectivo',hp:f.hp||'',items:L.map(l=>({code:l.p.code,qty:l.q}))}})});j=await r.json()}catch(e){j={ok:false,error:'net'}}
busy=false;if(j.ok){done={no:j.no||'',total:j.total!=null?j.total:tot().t,text:orderText(j.no,j.trk),trk:j.trk||''};cart={};sv('pd_cart',cart);oid=null}else msg=ERR[j.error]||'No se pudo enviar el pedido.';render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=b.dataset.c;
if(a==='add'||a==='inc')cart[c]=Math.min(99,(cart[c]||0)+1);else if(a==='dec'){cart[c]=(cart[c]||0)-1;if(cart[c]<=0)delete cart[c]}
else if(a==='mp'||a==='mn'){const n=(C.media||[]).length||1;mi=(mi+(a==='mn'?1:n-1))%n;const e2=$('#mk');if(e2)e2.outerHTML=mediaHtml();return}else if(a==='send'){send();return}else if(a==='again'){done=null;msg=''}else if(a==='trk'){loadTrack();return}else if(a==='retry'){init();return}
sv('pd_cart',cart);render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(f==='q'){q=e.target.value;$('#tl').innerHTML=tiles();return}if(f){form[f]=e.target.value;sv('pd_form',form)}});
async function init(){if(SQ&&API){await loadTrack();return}if(API){try{C=await (await jf(API+(API.includes('?')?'&':'?')+'action=catalog&t='+encodeURIComponent(T))).json()}catch(e){C=null}}render()}
setInterval(()=>{if(!C||done||!C.on)return;const M=C.media||[];if(M.length>1&&M[mi%M.length].type==='image'){mi=(mi+1)%M.length;const e2=$('#mk');if(e2)e2.outerHTML=mediaHtml()}},6000);
setInterval(()=>{if(SQ&&API&&!document.hidden)loadTrack()},30000);init();
</script></body></html>
