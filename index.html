const $=s=>document.querySelector(s);

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF=[["P001","Agua 500 ml",25],["P002","Refresco 355 ml",40],["P003","Jugo de naranja",60],["P004","Café",35],["P005","Pan",10],["P006","Galletas",30],["P007","Leche 1 L",75],["P008","Huevos (unidad)",12],["P009","Arroz 1 lb",38],["P010","Habichuelas 1 lb",55]].map((a,i)=>({code:a[0],name:a[1],price:a[2],var:i>=8}));
const C0=store.get('cfg',null)||{};
let cat=C0.cat||store.get('cat',DEF),rate=C0.rate??store.get('rate',18),pin=C0.pin||'',biz=C0.biz||'Mi Negocio';
let discs=C0.discs||[{id:'d1',name:'Cliente frecuente',type:'%',value:10,pin:false},{id:'d2',name:'Descuento gerente',type:'%',value:20,pin:true}];
const p2=n=>String(n).padStart(2,'0'),ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())},mk=d=>ymd(d).slice(0,7);
let sales=store.get('sales',[]);sales.forEach(s=>{s.id=s.id||s.ts+'-'+s.no});
const mig=e=>e.hist?e:{id:e.id,name:e.name,role:e.role||'',start:mk(new Date()),end:e.on===false?'0000-00':'',hist:[{from:mk(new Date()),sal:+e.sal||0}]};
let cf=null,exps=store.get('exps',[]),emps=(C0.emps||[]).map(mig),goals=C0.goals||[],fo=null,opct=C0.opct??50,mes=mk(new Date()),needUp=false;
let tab='caja',armed=false,armedH=false,unl=false,pinRes=null,shown=[],q='',act=0,clients=[nc()];
function nc(){return{name:'',pay:'Efectivo',rec:'',disc:'',lines:[],ped:false,tel:'',fecha:'',nota:''}}
const prod=c=>cat.find(p=>p.code===c)||{code:c,name:c+' (eliminado)',price:0};
const ep=l=>l.price!=null?l.price:prod(l.code).price;
const fno=n=>'F-'+String(n).padStart(4,'0');
const tiles=()=>cat.filter(p=>!q||(p.name+' '+p.code).toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="tile" data-a="tile" data-code="${esc(p.code)}"><b>${esc(p.name)}</b><small>${money(p.price)}</small></button>`).join('')||'<span class="mu">Sin resultados</span>';
const nextNo=()=>Math.max(srvMax,sales.reduce((m,s)=>Math.max(m,s.no),0))+1;
function calc(c){const sub=c.lines.reduce((s,l)=>s+ep(l)*l.qty,0),d=discs.find(x=>x.id===c.disc);const ds=d?Math.min(sub,d.type==='%'?sub*d.value/100:d.value):0,base=sub-ds,itbis=base*rate/100;return{sub,ds,dn:d?d.name:'',itbis,total:base+itbis}}
let cfgUpd=C0.upd||0,SYNC=store.get('sync',{url:SYNC_URL}),outbox=store.get('outbox',[]),busy=false,lastOk=0,sess=store.get('sess',null),sent=store.get('sent',{}),ru=store.get('ru',null),srvMax=store.get('smax',0),rej=0,orders=store.get('orders',[]),web=C0.web||{on:false,email:'',wa:''},os='',usersList=[],roleList=[],rdirty=false,imp=null;
if(!SYNC.url&&SYNC_URL)SYNC.url=SYNC_URL;
let rst=store.get('rid',null)!==RESET_ID&&Object.keys(C0).length>0;if(!rst)store.set('rid',RESET_ID);
function doReset(){if(!rst)return;rst=false;if(pin){pin='';saveCfg()}store.set('rid',RESET_ID)}
const cfgObj=()=>({cat,rate,discs,pin,biz,emps,opct,goals,web,upd:cfgUpd});
const SEC=['cat','rate','biz','web','discs','emps','opct','goals'],secObj=()=>({cat,rate,biz,web,discs,emps,opct,goals});
const sy=()=>!!SYNC.url,logged=()=>!!(sess&&sess.exp>Date.now());
const can=p=>!sy()||(logged()&&(sess.perms.includes('*')||sess.perms.includes(p)));
const dl={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
const NEWACT=['expense','expenses','delexp','order'];
function queue(m){if(!sy())return;if(needUp&&NEWACT.includes(m.action))return;if(m.action==='clear')outbox=[];outbox.push(m);store.set('outbox',outbox);flush()}
const saveCfg=()=>{cfgUpd=Date.now();store.set('cfg',cfgObj());const o={},c=secObj();SEC.forEach(k=>{if(JSON.stringify(c[k])!==sent[k])o[k]=c[k]});if(Object.keys(o).length)queue({action:'config',config:o})};
async function api(m,auth=true){const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(auth?{...m,auth:sess&&sess.token}:m)});return r.json()}
const apiTry=async(m,au=true)=>{try{return await api(m,au)}catch(e){return{ok:false,error:'net'}}};
function toast(t){const e=$('#tt');if(!e)return;e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,6000)}
function wipePrivate(){sales=sales.filter(x=>!x.sy);exps=exps.filter(x=>!x.sy);orders=orders.filter(x=>!x.sy);if(!outbox.some(m=>m.action==='config')){emps=[];goals=[];opct=50;web={on:false,email:'',wa:''}}usersList=[];roleList=[];sent={};ru=null;store.set('sales',sales);store.set('exps',exps);store.set('orders',orders);store.set('cfg',cfgObj());store.set('sent',sent);store.set('ru',null)}
function doLogout(msg){sess=null;store.set('sess',null);wipePrivate();showLogin(msg||'')}
async function flush(){if(!sy()||busy||!outbox.length||!logged())return;busy=true;setSt();
try{while(outbox.length){const m=outbox[0],j=await api(m);
if(!j.ok){if(j.error==='auth'){doLogout('Tu sesión venció. Entra de nuevo.');throw 0}
if(j.error==='action'){needUp=true}else if(j.error==='perm'||j.error==='bad'){rej++}else throw 0;outbox.shift();store.set('outbox',outbox);continue}
if(m.action==='expense'){const x=exps.find(v=>v.id===m.exp.id);if(x)x.sy=true;store.set('exps',exps)}
else if(m.action==='expenses'){const z=new Set(m.list.map(v=>v.id));exps.forEach(x=>{if(z.has(x.id))x.sy=true});store.set('exps',exps)}
else if(m.action==='sale'){const x=sales.find(v=>v.id===m.sale.id);if(x)x.sy=true;store.set('sales',sales)}
else if(m.action==='order'){const x=orders.find(v=>v.id===m.order.id);if(x&&x.u===m.order.u)x.sy=true;store.set('orders',orders)}
else if(m.action==='config'){Object.keys(m.config).forEach(k=>sent[k]=JSON.stringify(m.config[k]));store.set('sent',sent);if(j.rej&&j.rej.length)rej+=j.rej.length}
outbox.shift();store.set('outbox',outbox)}}catch(e){}busy=false;setSt()}
async function pullNow(){for(let i=0;i<30&&busy;i++)await new Promise(r=>setTimeout(r,100));return pull()}
async function pull(){if(!sy()||busy||!logged())return;try{const j=await api({action:'pull'});if(!j.ok){if(j.error==='auth')doLogout('Tu sesión venció. Entra de nuevo.');throw 0}
needUp=false;sess.perms=j.me.perms;sess.name=j.me.name;sess.rol=j.me.rol;store.set('sess',sess);srvMax=j.maxNo||0;store.set('smax',srvMax);
const rem=(j.sales||[]).map(x=>({...x,sy:true})),ids=new Set(rem.map(x=>x.id)),pend=sales.filter(x=>!x.sy&&!ids.has(x.id));
pend.forEach(x=>{if(!outbox.some(m=>m.sale&&m.sale.id===x.id))outbox.push({action:'sale',sale:x})});
sales=rem.concat(pend).sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);store.set('sales',sales);
if(j.expenses){const re=j.expenses.filter(x=>!outbox.some(m=>m.action==='delexp'&&m.id===x.id)).map(x=>({...x,sy:true})),eids=new Set(re.map(x=>x.id)),ep2=exps.filter(x=>!x.sy&&!eids.has(x.id));
ep2.forEach(x=>{if(!outbox.some(m=>(m.exp&&m.exp.id===x.id)||(m.list&&m.list.some(v=>v.id===x.id))))outbox.push({action:'expense',exp:x})});
exps=re.concat(ep2).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);store.set('exps',exps)}
if(j.orders){const prev=new Set(orders.map(x=>x.id)),ro=new Map(j.orders.map(x=>[x.id,x])),res=[];
j.orders.forEach(r=>{const l=orders.find(x=>x.id===r.id);res.push(l&&!l.sy&&(l.u||0)>(r.u||0)?l:{...r,sy:true})});
orders.forEach(l=>{if(!ro.has(l.id)&&!l.sy)res.push(l)});
res.filter(x=>!x.sy&&!outbox.some(m=>m.order&&m.order.id===x.id&&m.order.u===x.u)).forEach(x=>outbox.push({action:'order',order:{...x}}));
const nw=res.filter(x=>x.src==='web'&&x.estado==='pendiente'&&!prev.has(x.id)).length;if(nw&&lastOk)toast('🔔 '+nw+' pedido'+(nw>1?'s':'')+' nuevo'+(nw>1?'s':'')+' por internet');
orders=res.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);store.set('orders',orders)}
if(!rdirty){usersList=j.users||[];roleList=(j.config&&j.config.roles)||[]}
const o=j.config,pc=outbox.some(m=>m.action==='config');
if(o&&!pc){if(o.upd!==ru){if(o.cat)cat=o.cat;if(o.rate!==undefined)rate=o.rate;if(o.discs)discs=o.discs;if(o.biz)biz=o.biz;if(o.web)web=o.web;if(o.emps)emps=o.emps.map(mig);if(o.opct!==undefined)opct=o.opct;if(o.goals)goals=o.goals;ru=o.upd;store.set('ru',ru);SEC.forEach(k=>sent[k]=JSON.stringify(secObj()[k]));store.set('sent',sent);store.set('cfg',cfgObj())}
if(!o.cat&&can('prod')){sent={};saveCfg()}}
store.set('outbox',outbox);doReset();lastOk=Date.now();const ae=document.activeElement;if(!(tab!=='caja'&&ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')))render();flush()}catch(e){lastOk=0}setSt()}
async function shareInv(s){if(!s)return;const cv=drawInv(s),b=await new Promise(r=>cv.toBlob(r,'image/png')),f=new File([b],fno(s.no)+'.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Factura '+fno(s.no)});else await dl.save({filename:f.name,data:b})}catch(e){}}
const setSt=()=>{const e=$('#st');if(e)e.textContent=!sy()?'📴 Solo en este dispositivo':!logged()?'🔒 Sesión cerrada':needUp?'⚠ Actualiza el script de Google (Code.gs)':rej?`⚠ ${rej} cambio(s) rechazado(s) por permisos`:outbox.length?`⏳ Pendiente de enviar (${outbox.length})`:lastOk?'✔ Sincronizado':'⚠ Sin conexión con Sheets'};
