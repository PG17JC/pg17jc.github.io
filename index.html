<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caja Registradora</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#1f4e78"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ac:#1f4e78;--acx:#fff;--bd:#d9dee4;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#6fa8dc;--acx:#10161c;--bd:#33404d;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#6fa8dc;--acx:#10161c;--bd:#33404d;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
input[type=checkbox]{width:18px;height:18px;padding:0}
button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:bold}
main{padding:14px 16px;max-width:1200px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.step{display:inline-flex;align-items:center;gap:8px}.step b{min-width:24px;text-align:center;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:8px;align-items:center}.ch input{flex:1;min-width:0}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.q{display:inline-flex;align-items:center;gap:4px}.q button,.x{padding:2px 8px}.x{color:var(--bad)}
.lt{min-width:80px;text-align:right}.mu{color:var(--mu);margin:4px 0}small{font-size:11px}
.tt{display:flex;justify-content:space-between}.tt.big{font-size:16px;font-weight:bold}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{background:var(--ac);color:var(--acx)}td.r,th.r{text-align:right}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
#md{z-index:11}
.sheet{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.inv{background:#fff;color:#111;border-radius:8px;padding:16px;border:1px solid #ccc}
.inv h2{margin:0 0 2px;font-size:17px}.inv .mu{color:#555}.inv input,.inv button{color:#111;background:#fff;border-color:#bbb}
.inv th{background:#eee;color:#111}.inv td,.inv th{border-bottom:1px solid #ddd}.inv .pri{background:#1f4e78;color:#fff}
.msg{color:var(--bad);font-size:12px}.set{display:grid;gap:10px;max-width:700px}
button,select,input{touch-action:manipulation}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;min-height:58px}.tile small{color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.chip{white-space:nowrap}
.card.act{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.sb{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.sb .pri{margin-left:auto;min-height:44px;padding:0 22px}
main{padding-bottom:84px}
@media(max-width:700px){.card:not(.act){display:none}.card .pri{display:none}input,select,button{font-size:16px;min-height:40px}.q button{min-width:40px}header{padding:8px 12px}h1{font-size:16px}nav{flex-wrap:nowrap;overflow-x:auto;width:100%}nav button{white-space:nowrap}.br{grid-template-columns:84px 1fr 96px!important}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi .gk{grid-column:span 2;display:flex;flex-direction:column;gap:6px;border-color:var(--ac)}.gk .pri{align-self:flex-start}
@media(max-width:700px){.kpi{grid-template-columns:1fr 1fr}.kpi .gk{grid-column:1/-1}}
@media(max-width:700px){nav{flex-wrap:nowrap;overflow-x:auto;width:100%}nav button{white-space:nowrap}.br{grid-template-columns:84px 1fr 96px!important}}
.bars{display:grid;gap:8px}.br{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center}
.bt{background:var(--bd);border-radius:6px;height:22px;overflow:hidden;display:flex}.bt i{display:block;height:100%}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi>div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.kpi b{display:block;[...]
.pos{color:#1a9a55}.neg{color:var(--bad)}
.tr{display:flex;gap:10px;height:130px}.tr>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}.pair{display:flex;align-items:flex-end;gap:3px;height:100%}.pair i{display:block;width:18px;border-radius:4px 4px 0 0}
@media print{header,main,#md,.no-print{display:none!important}.ov{position:static;background:none;padding:0}.inv{border:0;page-break-after:always}}
</style></head>
<body>
<header><h1>🧾 Caja Registradora</h1><span id="st" class="mu"></span>
<nav><button data-t="caja">Caja</button><button data-t="hist">Historial</button><button data-t="prod">Productos</button><button data-t="desc">Descuentos</button><button data-t="gas">Gastos</button><button data-t="emp">Empleados</button><button data-t="fin">Finanzas</button></nav></header>
<main id="app"></main>
<div id="ov" class="ov" hidden></div><div id="md" class="ov" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// Opcional: pega aquí la URL de Apps Script y la clave para que todos los equipos queden conectados sin configurar nada.
const SYNC_URL='',SYNC_KEY='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const money=n=>'RD$ '+(+n||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF=[["P001","Agua 500 ml",25],["P002","Refresco 355 ml",40],["P003","Jugo de naranja",60],["P004","Café",35],["P005","Pan",10],["P006","Galletas",30],["P007","Leche 1 L",75],["P008","Huevo",12],["P009","Arroz 1 kg",90],["P010","Aceite 1 L",180]],C0=store.get('cfg',null)||{};
let cat=C0.cat||store.get('cat',DEF),rate=C0.rate??store.get('rate',18),pin=C0.pin||'',biz=C0.biz||'Mi Negocio';
let discs=C0.discs||[{id:'d1',name:'Cliente frecuente',type:'%',value:10,pin:false},{id:'d2',name:'Descuento gerente',type:'%',value:20,pin:true}];
const p2=n=>String(n).padStart(2,'0'),ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())},mk=d=>ymd(d).slice(0,7);
let sales=store.get('sales',[]);sales.forEach(s=>{s.id=s.id||s.ts+'-'+s.no});
const mig=e=>e.hist?e:{id:e.id,name:e.name,role:e.role||'',start:mk(new Date()),end:e.on===false?'0000-00':'',hist:[{from:mk(new Date()),sal:+e.sal||0}]};
let cf=null,exps=store.get('exps',[]),emps=(C0.emps||[]).map(mig),goals=C0.goals||[],fo=null,opct=C0.opct??50,mes=mk(new Date()),needUp=false;
let tab='caja',armed=false,armedH=false,unl=false,pinRes=null,shown=[],q='',act=0,clients=[nc()];
function nc(){return{name:'',pay:'Efectivo',rec:'',disc:'',lines:[]}}
const prod=c=>cat.find(p=>p.code===c)||{code:c,name:c+' (eliminado)',price:0};
const ep=l=>l.price!=null?l.price:prod(l.code).price;
const fno=n=>'F-'+String(n).padStart(4,'0');
const tiles=()=>cat.filter(p=>!q||(p.name+' '+p.code).toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="tile" data-a="tile" data-code="${esc(p.code)}"><b>${esc(p.name)}</b><small>${money(p.price)}</small></button>`).join('');
const nextNo=()=>sales.reduce((m,s)=>Math.max(m,s.no),0)+1;
function calc(c){const sub=c.lines.reduce((s,l)=>s+ep(l)*l.qty,0),d=discs.find(x=>x.id===c.disc);const ds=d?Math.min(sub,d.type==='%'?sub*d.value/100:d.value):0,base=sub-ds,itbis=base*rate/100;return {sub,ds,itbis,total:base+itbis};}
let cfgUpd=C0.upd||0,SYNC=store.get('sync',{url:SYNC_URL,key:SYNC_KEY}),outbox=store.get('outbox',[]),busy=false,lastOk=0;
const cfgObj=()=>({cat,rate,discs,pin,biz,emps,opct,goals,upd:cfgUpd});
const sy=()=>SYNC.url&&SYNC.key;
const dl={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);document.body.removeChild(a);}};
function queue(m){if(!sy())return;outbox.push(m);store.set('outbox',outbox)}
const saveCfg=()=>{cfgUpd=Date.now();store.set('cfg',cfgObj());queue({action:'config',config:cfgObj()})};
async function flush(){if(!sy()||busy||!outbox.length)return;busy=true;try{while(outbox.length){const m=outbox[0];await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...m,key:SYNC.key})});outbox.shift();store.set('outbox',outbox)}}catch(e){}busy=false}
async function pull(){if(!sy()||busy)return;try{const r=await fetch(SYNC.url+(SYNC.url.includes('?')?'&':'?')+'action=pull&key='+encodeURIComponent(SYNC.key)),j=await r.json();if(j.ok){lastOk=Date.now();render();flush()}}catch(e){lastOk=0}setSt()}
const setSt=()=>{const e=$('#st');if(e)e.textContent=!sy()?'📴 Solo en este dispositivo':outbox.length?`⏳ Pendiente de enviar (${outbox.length})`:'';};
async function hs(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('caja:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return p}}
const md=h=>{const m=$('#md');m.hidden=!h;m.innerHTML=h?`<div class="sheet"><div class="inv">${h}</div></div>`:''};
function askPin(){return Promise.resolve(true)}
function card(c,i){const t=calc(c);return `<section class="card${i===act?' act':''}" data-i="${i}"><div class="ch"><b>Cliente ${i+1}</b><input data-f="name" placeholder="Nombre (opcional)" value="${esc(c.name)}"></div><div>${c.lines.length?c.lines.map((l,j)=>{const p=prod(l.code),pr=l.editing?`<input data-f="lp" type="number" min="0" step="0.01" value="${ep(l)}" style="width:90px;padding:3px"> <button data-a="ok" data-j="${j}">OK</button>`:`Precio: ${money(ep(l))}`;return `<div class="ln"><span>${esc(p.name)}<br><small class="mu">${pr}</small></span><span class="q"><button data-a="dec" data-j="${j}">−</button><b>${l.qty}</b><button data-a="inc" data-j="${j}">+</button></span><span class="lt">${money(ep(l)*l.qty)}</span><button class="x" data-a="del" data-j="${j}">✕</button></div>`}).join(''):'<p class="mu">Sin artículos</p>'}</div><div class="tt"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.ds?`<div class="tt"><span>Descuento</span><span>-${money(t.ds)}</span></div>`:''}<div class="tt"><span>ITBIS (${rate}%)</span><span>${money(t.itbis)}</span></div><div class="tt big"><span>Total</span><span>${money(t.total)}</span></div><label>Descuento<select data-f="disc"><option value="">Sin descuento</option>${discs.map(d=>`<option value="${d.id}"${c.disc===d.id?' selected':''}>${esc(d.name)} (${d.type==='%'?d.value+'%':money(d.value)})</option>`).join('')}</select></label><label>Pago<select data-f="pay">${['Efectivo','Tarjeta','Transferencia'].map(m=>`<option${m===c.pay?' selected':''}>${m}</option>`).join('')}</select></label><button class="pri" data-a="submit"${t.total?'':' disabled'}>Someter</button></section>`}
function render(){
 act=Math.max(0,Math.min(+act||0,clients.length-1));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const a=$('#app');
 if(tab==='caja'){const n=clients.filter(c=>c.lines.length).length;a.innerHTML=`<div class="bar"><span class="step">Clientes en caja: <button data-a="less">−</button><b>${clients.length}</b><button data-a="more">+</button></span><button class="pri" data-a="all"${n?'':' disabled'}>Someter todos (${n})</button></div><div class="box"><input data-f="q" placeholder="Buscar producto…" value="${esc(q)}" style="width:100%;margin-bottom:8px"><div class="tiles">${tiles()}</div><div class="grid">${clients.map(card).join('')}</div></div><div class="sb"><span>Cliente ${act+1}: <b>${money(calc(clients[act]).total)}</b></span><button class="pri" data-a="subact"${calc(clients[act]).total?'':' disabled'}>Someter</button></div>`}
 else {a.innerHTML='<div class="mu">Sección no disponible.</div>'}
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,cd=b.closest('.card'),i=cd?+cd.dataset.i:0,j=+b.dataset.j,c=clients[i];if(cd&&cd.dataset.i!==undefined)act=i;
 if(a==='tile'){const cl=clients[act],l=cl.lines.find(x=>x.code===b.dataset.code&&x.price==null);l?l.qty++:cl.lines.push({code:b.dataset.code,qty:1});render();return}
 if(a==='more'){clients.push(nc());act=clients.length-1;render();return}
 if(a==='less'){if(clients.length>1)clients.pop();act=clients.length-1;render();return}
 if(a==='inc')c.lines[j].qty++;
 else if(a==='dec'){if(c.lines[j].qty>1)c.lines[j].qty--;else c.lines.splice(j,1)}
 else if(a==='del')c.lines.splice(j,1);
 else if(a==='submit'||a==='subact'){render();return}
 else if(a==='all'){render();return}
 render();
});
document.addEventListener('change',async e=>{const f=e.target.dataset.f,card=e.target.closest('.card'),k=+e.target.dataset.k,v=e.target.value,c=card&&clients[+card.dataset.i];
 if(f==='pay'){c.pay=v;render()}
 else if(f==='disc'){c.disc=v;render()}
 });
document.addEventListener('input',e=>{const f=e.target.dataset.f,card=e.target.closest('.card');if(f==='q'){q=e.target.value;render();return}if(!card)return;const i=+card.dataset.i,c=clients[i];if(f==='name')c.name=e.target.value;});
render();
</script></body></html>
